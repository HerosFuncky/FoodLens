services:
  backend:
    build: ./backend
    image: foodlensacr.azurecr.io/foodlens-backend:v1
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - LM_STUDIO_URL=http://host.docker.internal:1234
      - LM_STUDIO_MODEL=qwen/qwen3-8b
      - USE_OFFLINE_CV=false
    extra_hosts:
      - "host.docker.internal:host-gateway"

  azure-cv:
    image: mcr.microsoft.com/azure-cognitive-services/vision/analyze:latest
    profiles: ["offline"]
    ports:
      - "127.0.0.1:5001:5000"
    env_file:
      - ./backend/.env
    environment:
      - Eula=accept
      - Billing=${AZURE_CV_ENDPOINT:-https://foodlens-cv-a3ba7.cognitiveservices.azure.com/}
      - ApiKey=${AZURE_CV_KEY}

  frontend:
    build: ./frontend
    image: foodlens-frontend:v1
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
